<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Sahifa</title>
  <style>
    body {
      background-image: url('https://zamin.uz/uploads/posts/2019-10/1572357070_04.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    /* Kompyuter versiyasi */
    .video-desktop {
      display: block;
      width: 800px;
      height: 600px;
      margin: 80px auto;
    }

    /* Telefon versiyasi */
    .video-mobile {
      display: none;
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      overflow: hidden;
      margin-top: 40px;
    }

    .video-mobile iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Ekran o‘lchamiga qarab ko‘rsatish */
    @media (max-width: 768px) {
      .video-desktop {
        display: none;
      }
      .video-mobile {
        display: block;
      }
    }
  </style>
</head>
<body>

  <!-- Kompyuter versiyasi -->
  <iframe class="video-desktop"
    src="https://www.youtube.com/embed/SYsKk91ExMs?si=gyPEJz8LXAVrGLpx"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <!-- Telefon versiyasi -->
  <div class="video-mobile">
    <iframe
      src="https://www.youtube.com/embed/SYsKk91ExMs?si=gyPEJz8LXAVrGLpx"
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
